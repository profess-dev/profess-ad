[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'

[project]
name = 'professad'
version = '1.0.1'

authors = [
  {name = 'Chuin Wei Tan', email = 'chuinwei_tan@g.harvard.edu'}
]

maintainers = [
  {name = 'Chuin Wei Tan', email = 'chuinwei_tan@g.harvard.edu'}
]

description = 'PROFESS-AD is a PyTorch-based auto-differentiable orbital-free density functional theory package.'
readme = 'README.md'
license = {file = "LICENSE"}
dependencies = [
    'torch',
    'xitorch',
    'matscipy',
    'numpy',
    'ase',
]

[project.optional-dependencies]
dev = [
    'ruff',
    'pre-commit',
    'sphinx',
    'pydata-sphinx-theme',
    'matplotlib',
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
exclude = [
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "docs",
    ".git",
    "__pycache__",
    "tutorial_examples",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E226", "E501", "E741", "E743", "C901", "E203", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
